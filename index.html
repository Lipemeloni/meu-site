<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Links - Redirecionamento Seguro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .timer-box {
      font-size: 2.5rem;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 25px;
    }

    .btn-acessar {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
      width: 100%;
    }

    .btn-acessar:hover:not(:disabled) {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .btn-acessar:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Aguarde um momento</h1>
    <p>Seu link está sendo preparado. O botão será liberado assim que a contagem terminar.</p>

    <div class="timer-box" id="timer">10</div>

    <button id="accessBtn" class="btn-acessar" disabled>Aguarde...</button>

    <p class="footer-note">Link verificado e seguro.</p>
  </div>

  <script>
    // Configurações do Temporizador
    let tempoRestante = 10;
    const timerElement = document.getElementById('timer');
    const accessBtn = document.getElementById('accessBtn');

    // 1. COLE SEU DIRECT LINK DA MONETAG AQUI:
    const linkMonetag = "https://uplcm.com/4/12001809"; 

    // 2. COLE O LINK DO SITE DESTINO AQUI (O SITE QUE O USUÁRIO QUER VER):
    const linkDestino = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

    // Contagem Regressiva
    const contagem = setInterval(() => {
      tempoRestante--;
      timerElement.textContent = tempoRestante;

      if (tempoRestante <= 0) {
        clearInterval(contagem);
        timerElement.style.display = 'none';
        accessBtn.textContent = 'Acessar Link';
        accessBtn.disabled = false;
      }
    }, 1000);

    // Evento de Clique no Botão
    accessBtn.addEventListener('click', () => {
      // Abre o anúncio da Monetag em uma nova aba
      if (linkMonetag && linkMonetag !== "https://uplcm.com/4/12001809") {
        window.open(linkMonetag, '_blank');
      }

      // Abre o site de destino em outra nova aba
      if (linkDestino && linkDestino !== "https://www.youtube.com/watch?v=dQw4w9WgXcQ") {
        window.open(linkDestino, '_blank');
      } else {
        alert("Por favor, configure o linkDestino no código HTML.");
      }
    });
  </script>

</body>
</html>
