<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Downloads - Link Seguro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .timer-box {
      font-size: 2.5rem;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 25px;
    }

    .btn-download {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
      width: 100%;
    }

    .btn-download:hover:not(:disabled) {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .btn-download:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Aguarde o seu Download</h1>
    <p>O seu link seguro está a ser preparado. O botão será liberado assim que o contador terminar.</p>

    <div class="timer-box" id="timer">10</div>

    <button id="downloadBtn" class="btn-download" disabled>Aguarde...</button>

    <p class="footer-note">Download verificado e seguro contra vírus.</p>
  </div>

  <script>
    // Configurações
    let tempoRestante = 10;
    const timerElement = document.getElementById('timer');
    const downloadBtn = document.getElementById('downloadBtn');

    // COLE O SEU DIRECT LINK DA MONETAG AQUI:
    const linkMonetag = "COLE_SEU_DIRECT_LINK_AQUI"; 

    // LINK DO ARQUIVO REAL QUE O USUÁRIO VAI BAIXAR:
    const linkDownloadReal = "COLE_LINK_DO_ARQUIVO_FINAL_AQUI";

    // Contagem Regressiva
    const contagem = setInterval(() => {
      tempoRestante--;
      timerElement.textContent = tempoRestante;

      if (tempoRestante <= 0) {
        clearInterval(contagem);
        timerElement.style.display = 'none';
        downloadBtn.textContent = 'Baixar Agora';
        downloadBtn.disabled = false;
      }
    }, 1000);

    // Evento de Clique no Botão
    downloadBtn.addEventListener('click', () => {
      // 1. Abre o anúncio da Monetag em uma nova aba
      if (linkMonetag && linkMonetag !== "COLE_SEU_DIRECT_LINK_AQUI") {
        window.open(linkMonetag, '_blank');
      }

      // 2. Inicia o download do arquivo na aba atual
      if (linkDownloadReal && linkDownloadReal !== "COLE_LINK_DO_ARQUIVO_FINAL_AQUI") {
        window.location.href = linkDownloadReal;
      } else {
        alert("O link do arquivo final precisa ser configurado no código.");
      }
    });
  </script>

</body>
</html>
