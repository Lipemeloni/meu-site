<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Downloads - Link Seguro</title>
  <meta name="monetag" content="421f79f20d74414a0b47af9ad6544701">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Espaço reservado para os Anúncios */
    .ad-banner {
      background-color: #0f172a;
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 40px 10px;
      margin: 20px 0;
      color: #64748b;
      font-size: 13px;
    }

    .timer-box {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #f59e0b;
    }

    .btn-download {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-download:disabled {
      background-color: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-download.ready {
      background-color: #22c55e;
    }

    .btn-download.ready:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Seu link está quase pronto!</h1>
    <p>Aguarde a contagem regressiva para liberar o acesso ao download.</p>

    <!-- ÁREA ONDE OS ANÚNCIOS FICARÃO -->
    <div class="ad-banner">
      [ Espaço reservado para Anúncios (Monetag / AdSense) ]
    </div>

    <div class="timer-box" id="timer-status">
      Aguarde <span id="seconds">10</span> segundos...
    </div>

    <button id="download-btn" class="btn-download" disabled>Aguarde...</button>
  </div>

  <script>
    let tempoRestante = 10;
    const elementoSegundos = document.getElementById('seconds');
    const elementoStatus = document.getElementById('timer-status');
    const botaoDownload = document.getElementById('download-btn');

    // COLOQUE O LINK FINAL DO SEU ARQUIVO/PROJETO AQUI
    const linkDestino = "https://github.com";

    const contador = setInterval(() => {
      tempoRestante--;
      elementoSegundos.innerText = tempoRestante;

      if (tempoRestante <= 0) {
        clearInterval(contador);
        elementoStatus.innerText = "Link liberado com sucesso!";
        elementoStatus.style.color = "#22c55e";
        
        botaoDownload.disabled = false;
        botaoDownload.innerText = "Acessar Conteúdo Agora 🚀";
        botaoDownload.classList.add('ready');
      }
    }, 1000);

    botaoDownload.addEventListener('click', () => {
      if (!botaoDownload.disabled) {
        window.location.href = linkDestino;
      }
    });
  </script>
</body>
</html>
